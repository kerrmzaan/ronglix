<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <defs>
        <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f0ff"/>
            <stop offset="100%" stop-color="#b06bff"/>
        </linearGradient>
        <linearGradient id="logo-grad-2" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00f0ff"/>
            <stop offset="100%" stop-color="#ff2e88"/>
        </linearGradient>
        <filter id="logo-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="1.5" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <!-- Outer hex -->
    <path d="M32 4 L56 18 L56 46 L32 60 L8 46 L8 18 Z" stroke="url(#logo-grad)" stroke-width="1.5" fill="none" opacity="0.4"/>
    <!-- Inner hex -->
    <path d="M32 12 L48 21 L48 43 L32 52 L16 43 L16 21 Z" stroke="url(#logo-grad-2)" stroke-width="2" fill="none" filter="url(#logo-glow)"/>
    <!-- Center 'R' mark -->
    <g filter="url(#logo-glow)">
        <path d="M22 22 L22 42 M22 22 L34 22 Q40 22 40 28 Q40 34 34 34 L28 34 L40 42" stroke="url(#logo-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <!-- Corner accents -->
    <circle cx="32" cy="32" r="2" fill="#00f0ff">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Outer dots -->
    <circle cx="8" cy="18" r="1.5" fill="#00f0ff"/>
    <circle cx="56" cy="18" r="1.5" fill="#b06bff"/>
    <circle cx="8" cy="46" r="1.5" fill="#b06bff"/>
    <circle cx="56" cy="46" r="1.5" fill="#ff2e88"/>
</svg>